name: Tests
on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - name: Check out repository
              uses: actions/checkout@v7
              
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                
            - name: Install dependencies
              run: pip install -r requirements.txt
              
            - name: Run tests
              run: python -m pytest